name: Android

on:
  pull_request:
  push:
    branches: [main, "build/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm install
      - run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Apply GIBP native background worker
        run: |
          chmod +x scripts/apply-android-overlay.sh
          ./scripts/apply-android-overlay.sh

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gibp-mail-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
